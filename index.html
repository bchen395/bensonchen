<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Benson Chen" />
    <title>Benson Chen</title>
  </head>
  <body class="home">
    <header id="name-slot"></header>

    <!-- paper-white ring around each dot so the shapes read over footage -->
    <svg class="defs" width="0" height="0" aria-hidden="true">
      <filter id="dot-ring">
        <!-- blur + steep alpha grows each dot evenly (feMorphology's square kernel squares them off) -->
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" />
        <feComponentTransfer result="grown">
          <feFuncA type="linear" slope="5" />
        </feComponentTransfer>
        <feFlood flood-color="#ffffff" />
        <feComposite in2="grown" operator="in" />
        <feMerge>
          <feMergeNode />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </svg>

    <a class="shape shape-heart" href="/love.html" aria-label="Things I love">
      <video class="reel" data-reel="heart" muted loop playsinline aria-hidden="true"></video>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path
          pathLength="38"
          d="M50 87 C22 64 9 47 9 31 C9 15 20 7 31 7 C41 7 47 13 50 21 C53 13 59 7 69 7 C80 7 91 15 91 31 C91 47 78 64 50 87 Z"
        />
      </svg>
      <span class="label">things i love</span>
    </a>

    <a class="shape shape-star" href="/work.html" aria-label="My work">
      <video class="reel" data-reel="work" muted loop playsinline aria-hidden="true"></video>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path pathLength="50" d="M50 6 L59.75 36 L92 36 L65.97 55.14 L76 86 L50 66.88 L24 86 L34.03 55.14 L8 36 L40.25 36 Z" />
      </svg>
      <span class="label">work</span>
    </a>

    <a class="shape shape-note" href="/music.html" aria-label="Music">
      <video class="reel" data-reel="note" muted loop playsinline aria-hidden="true"></video>
      <svg viewBox="0 0 70 100" aria-hidden="true">
        <!-- an oval dot sits where the stem meets it (38, 76.66); the stem starts one step above -->
        <ellipse pathLength="11" style="stroke-dashoffset: 0.1" cx="24" cy="82" rx="15" ry="11" transform="rotate(-18 24 82)" />
        <path
          style="stroke-dasharray: 0.01 7.175 0.01 7.175 0.01 7.175 0.01 7.175 0.01 7.175 0.01 7.175 0.01 7.175 0.01 7.175 0.01 7.871 0.01 7.871 0.01 7.871 0.01 7.871 0.01 7.851 0.01 50"
          d="M38 69.48 L38 12 C50 19 60 26 60 42"
        />
      </svg>
      <span class="label">music</span>
    </a>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
